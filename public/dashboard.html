<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A free habit tracker for building daily habits, tracking streaks, and visualizing your progress."
    />
    <meta name="keywords" content="Habit Tracker Productivity" />
    <title>Dashboard | Habit Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/images/habit-tracker-icon.svg" />
    <link rel="stylesheet" href="/css/app.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/tsparticles-confetti/2.12.0/tsparticles.confetti.bundle.min.js"
      integrity="sha512-3LobCjM2nQ9WclTbZY+5+IqLKwUTlBaUJTmGWdsIr7M6T5F/l25oIBNeITuef+mbD8PBvmuCF9fwXVn+PCT23Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="/js/auth.js" defer></script>
    <script src="/js/dashboard.js" defer></script>
  </head>
  <body class="flex flex-col min-h-dvh bg-background text-foreground">
    <header class="flex justify-center bg-primary">
      <div
        class="flex flex-col gap-2 sm:flex-row justify-between items-center w-full p-3 max-w-5xl"
      >
        <a href="/" class="flex items-center gap-2 cursor-pointer select-none">
          <img
            class="h-7"
            src="/images/icon-darkest-slate.svg"
            alt=""
            width="28"
            height="28"
          />
          <p class="font-bold text-black">Habit Tracker</p>
        </a>

        <button
          id="profile-button"
          class="block text-center w-full sm:w-auto text-sm font-bold text-primary px-3 py-2 bg-background border border-foreground shadow-2xl hover:brightness-105 cursor-pointer select-none rounded-xl"
        >
          Account
        </button>
      </div>
    </header>
    <main class="flex-1 flex flex-col items-center py-7 md:py-10">
      <div class="flex flex-col w-full max-w-5xl px-4 sm:px-8">
        <section
          class="flex flex-col md:flex-row items-center justify-between gap-4"
        >
          <h1 class="text-5xl font-bold text-primary">Your Progress</h1>
          <div class="flex gap-4">
            <div
              id="daily-streak"
              class="relative flex items-center gap-3 overflow-hidden rounded-xl border border-primary/50 bg-surface text-primary px-4 py-2 shadow-md"
              role="status"
              aria-live="polite"
              aria-atomic="true"
              title="Complete at least one habit every day to keep your streak alive"
            >
              <span
                class="pointer-events-none absolute inset-0 bg-linear-to-r from-primary/20 via-transparent to-secondary/20 bg-background text-black"
                aria-hidden="true"
              ></span>
              <span
                id="streak-flame"
                class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-linear-to-br from-primary to-secondary text-background shadow-lg transition-all duration-300 ease-out"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  class="h-5 w-5"
                  aria-hidden="true"
                >
                  <path
                    d="M13.5 0.67s0.74 2.65 0.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l0.03-0.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5 0.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-0.36 3.6-1.21 4.62-2.58 0.39 1.29 0.59 2.65 0.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"
                  />
                </svg>
              </span>
              <span class="relative flex flex-col leading-tight">
                <span class="text-sm font-bold">
                  <span id="streak-count" class="inline-block">0</span>
                  <span id="streak-label">Day Streak</span>
                </span>
                <span id="streak-best" class="text-xs opacity-70"
                  >Best: 0 days</span
                >
              </span>
            </div>
            <button
              id="add-habit-button"
              class="rounded-lg bg-primary hover:brightness-105 px-4 py-2 text-sm font-semibold text-black border border-foreground cursor-pointer select-none"
            >
              + Add Habit
            </button>
          </div>
        </section>

        <div class="flex flex-col md:flex-row gap-14 mt-10">
          <section class="flex justify-center">
            <div
              id="progress-circle"
              class="flex h-44 w-44 items-center justify-center rounded-full bg-surface"
              role="progressbar"
              aria-label="Today's habit completion"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div
                class="flex h-36 w-36 items-center justify-center rounded-full bg-amber-100"
              >
                <span id="progress-percent" class="text-3xl font-bold text-background">0%</span>
              </div>
            </div>
          </section>

          <section class="flex-1">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h2 class="text-lg font-bold">This Week</h2>
              <label for="date-selector" class="sr-only">Select a date</label>
              <input
                id="date-selector"
                type="date"
                class="rounded-lg border border-surface bg-white px-3 py-2 text-sm cursor-pointer"
                aria-label="Select a date"
              />
            </div>
            <div
              id="week-dates"
              class="mt-4 grid grid-cols-5 gap-2 text-center"
              role="group"
              aria-label="Weekday date selector"
            ></div>
            <p
              id="message"
              class="mt-5 min-h-6 text-sm text-red-600"
              role="alert"
            ></p>
            <div class="relative">
              <div
                id="loading-indicator"
                class="absolute inset-0 z-10 flex items-center justify-center"
                role="status"
                aria-label="Loading habits"
              >
                <div
                  class="h-8 w-8 animate-spin rounded-full border-4 border-surface border-t-primary"
                ></div>
              </div>
              <div
                id="habit-list"
                class="mt-2 min-h-24 space-y-3 transition-opacity"
              ></div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <div
      id="habit-modal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 px-3"
    >
      <div
        class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl overflow-auto max-h-dvh"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <h2 id="modal-title" class="text-xl font-bold">Add Habit</h2>

        <div class="mt-5 space-y-4">
          <div>
            <label for="habit-name" class="mb-2 block text-sm font-semibold"
              >Habit name</label
            >
            <input
              id="habit-name"
              maxlength="80"
              class="w-full border border-slate-300 px-3 py-2"
              placeholder="Drink Water"
            />
          </div>
          <div>
            <label
              for="habit-description"
              class="mb-2 block text-sm font-semibold"
              >Description</label
            >
            <input
              id="habit-description"
              maxlength="500"
              class="w-full border border-slate-300 px-3 py-2"
              placeholder="2L Daily Goal"
            />
          </div>
          <div>
            <label for="habit-icon" class="mb-2 block text-sm font-semibold"
              >Icon</label
            >
            <input
              id="habit-icon"
              maxlength="8"
              class="w-full border border-slate-300 px-3 py-2"
              placeholder="W"
            />
          </div>
        </div>

            <div
      id="habit-modal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 px-3 z-50"
    >
      <div
        class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl overflow-auto max-h-dvh text-black"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <h2 id="modal-title" class="text-xl font-bold">Add Habit</h2>

        <div class="mt-5 space-y-4">
          <div>
            <label for="habit-name" class="mb-2 block text-sm font-semibold"
              >Habit name</label
            >
            <input
              id="habit-name"
              maxlength="80"
              class="w-full rounded-lg border border-slate-300 px-3 py-2"
              placeholder="Drink Water"
            />
          </div>
          <div>
            <label
              for="habit-description"
              class="mb-2 block text-sm font-semibold"
              >Description</label
            >
            <input
              id="habit-description"
              maxlength="500"
              class="w-full rounded-lg border border-slate-300 px-3 py-2"
              placeholder="2L Daily Goal"
            />
          </div>
          <div>
            <label for="habit-icon" class="mb-2 block text-sm font-semibold"
              >Icon</label
            >
            <input
              id="habit-icon"
              maxlength="8"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-lg"
              placeholder="✅"
            />
            <!-- Quick Icon Picker -->
            <div id="icon-picker" class="mt-2 flex flex-wrap gap-2">
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">💧</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">🏃</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">📚</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">🧘</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">🥗</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">💤</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">💻</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">🎸</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">🧹</button>
              <button type="button" class="icon-choice rounded-lg border border-slate-300 px-2.5 py-1 text-lg hover:bg-slate-100 cursor-pointer">✅</button>
            </div>
          </div>
        </div>

        <div class="mt-6 flex justify-end gap-3">
          <button
            id="cancel-button"
            type="button"
            class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold cursor-pointer select-none"
          >
            Cancel
          </button>
          <button
            id="save-habit-button"
            type="button"
            class="rounded-lg bg-amber-400 hover:brightness-105 px-4 py-2 text-sm font-semibold text-black cursor-pointer select-none"
          >
            Save Habit
          </button>
        </div>
      </div>
    </div>

    <div
      id="profile-modal"
      class="fixed inset-0 hidden items-center justify-center bg-black/40 px-3"
    >
      <div
        class="w-full max-w-md rounded-xl bg-white p-6 shadow-xl overflow-auto max-h-dvh"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-modal-title"
      >
        <h2 id="profile-modal-title" class="text-xl font-bold">Account</h2>

        <div class="mt-5 space-y-4">
          <div>
            <label for="profile-name" class="mb-2 block text-sm font-semibold"
              >Name</label
            >
            <input
              id="profile-name"
              class="w-full border border-slate-300 px-3 py-2"
              placeholder="John Doe"
              readonly
            />
          </div>
          <div>
            <label for="profile-email" class="mb-2 block text-sm font-semibold"
              >Email</label
            >
            <input
              id="profile-email"
              class="w-full border border-slate-300 px-3 py-2"
              placeholder="johndoe@email.com"
              readonly
            />
          </div>
        </div>

        <div class="mt-6 flex justify-end gap-3">
          <button
            id="profile-cancel-button"
            class="rounded-lg border border-slate-300 px-4 py-2 font-semibold cursor-pointer select-none"
          >
            Cancel
          </button>
          <button
            id="logout-button"
            class="rounded-lg bg-red-500 hover:brightness-105 px-4 py-2 text-sm font-semibold text-white cursor-pointer select-none"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
    <footer
      class="bg-yellow-600 text-black mt-14"
    >
      <div class="p-3 mx-auto flex flex-col sm:flex-row gap-3 items-center sm:justify-between w-full max-w-5xl">
        <a href="/" class="cursor-pointer select-none font-bold"
          >Habit Tracker</a
        >
        <p class="text-sm font-bold">2026 Habit Tracker Pty Ltd</p>
      </div>
    </footer>
  </body>
</html>
